# IMPORTANTE: en YAML escribir exponentes con signo: 1.0e+8 (no 1.0e8), o PyYAML lo lee como texto.
# Parámetros nominales (fuente única de verdad). Unidades: tiempo en días.
nominal:
  rS: 1.0
  rT: 0.9
  rR: 0.8          # coste de fitness
  dS: 2.0          # muerte por unidad de concentración
  dT: 0.5
  dR: 0.1
  muST: 1.0e-4
  muTR: 1.0e-5
  K: 1.0e+8
  x0: {S: 1.0e+7, T: 1.0e+3, R: 1.0e+1}

scenarios:
  A:   # tratamiento único sin recuperación
    dt_horas: 2.4          # 0.1 día
    duracion_dias: 5
    esquema: constante
    C: 1.0
  B:   # ciclos 3 h con antibiótico + 21 h sin
    dt_horas: 0.5
    duracion_dias: 20
    esquema: ciclico
    C: 5.0
    horas_exposicion: 3
  C:   # mutación metabólica (muST sube x10, muTR baja x10 respecto a B)
    dt_horas: 0.0625
    duracion_dias: 100
    esquema: ciclico
    C: 5.0
    horas_exposicion: 3
    override: {muST: 1.0e-3, muTR: 1.0e-6}
  D:   # estimación con Kalman
    dt_horas: 0.5
    duracion_dias: 20
    esquema: ciclico
    C: 5.0
    horas_exposicion: 3
    kalman:
      sigma_obs_rel: 0.10   # error relativo de conteo de placas
      q_rel: 0.02           # ruido de proceso relativo
  E:   # datos de literatura (pendiente: obtener referencias)
    nota: "Completar con datos de ALE con ofloxacino"

# Bayes sencillo: niveles de un experimento didactico, no umbrales clinicos.
bayes:
  niveles:
    Concentracion: [1.0, 5.0]
    Duracion: [10.0, 20.0]
    Frecuencia: [0.5, 1.0]       # ciclos por dia; pulsos de 3 horas
    TolerPrevia: [0.0001, 0.01]  # T/(S+T) al inicio
    TasaMutacion: [nominal, metabolico] # 1: muST sube y muTR baja (escenario C)
    CosteFitness: [0.0, 0.2]     # 1-rR/rS
  prior_estado_1: 0.5           # escenarios equiprobables por supuesto didactico
  dt_horas: 0.5
  horas_exposicion: 3.0
  volumen_ml: 0.001             # volumen efectivo del evento de adquisicion
  semilla: 19
  factores_Q: [0.25, 1.0]      # ejercicio cruzado de Kalman
  factores_R: [0.5, 1.0, 2.0]
  factor_inicial_kalman: [1.2, 0.8, 1.3]
  sd_inicial_kalman: 0.5
  perfil_escenario: {A: 0, B: 0, C: 1, D: 0}
